<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bear LP</title>
<meta name="description" content="An Investment Holding Company">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="Bear LP">
<meta property="og:description" content="An Investment Holding Company">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bearlp.com/">
<meta property="og:image" content="https://bearlp.com/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#0a1c2c;color:#f3eee3;min-height:100vh;min-height:100dvh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:fade 45s linear infinite}
.slide.s1{object-position:94% center;animation-delay:0s}
.slide.s2{object-position:center;animation-delay:9s}
.slide.s3{object-position:center;animation-delay:18s}
.slide.s4{object-position:center;animation-delay:27s}
.slide.s5{object-position:center;animation-delay:36s}
@keyframes fade{0%{opacity:0}2.4%{opacity:1}20%{opacity:1}24.8%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.slide{animation:none}.slide.s1{opacity:1}}
.scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,24,38,.85) 0%,rgba(6,24,38,.35) 32%,rgba(6,24,38,0) 58%),linear-gradient(to bottom,rgba(6,24,38,.35) 0%,rgba(6,24,38,0) 20%)}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:26px 38px;font-size:10px;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:rgba(243,238,227,.85);z-index:3}
.topbar .lft{color:#c9b184}
.block{position:absolute;left:38px;bottom:44px;z-index:3}
.block img{width:min(440px,78vw);height:auto;display:block}
.rule{width:64px;height:1px;background:#aa936d;margin:25px 0 17px}
.descriptor{font-size:11px;font-weight:500;letter-spacing:.38em;text-transform:uppercase;color:#f3eee3;line-height:1.9}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
@media (max-width:640px){
  .topbar{padding:20px}
  .block{left:20px;right:20px;bottom:30px}
  .slide.s1{object-position:96% center}
}
</style>
</head>
<body>
<img class="slide s1" src="assets/ridge.jpg" alt="">
<img class="slide s2" src="assets/forest.jpg" alt="">
<img class="slide s3" src="assets/coast.jpg" alt="">
<img class="slide s4" src="assets/lake.jpg" alt="">
<img class="slide s5" src="assets/pair.jpg" alt="">
<div class="scrim" aria-hidden="true"></div>
<div class="topbar"><span class="lft">Bear LP</span><span>bearlp.com</span></div>
<main class="block">
  <h1 class="visually-hidden">Bear LP</h1>
  <img src="assets/horiz-silver.svg" alt="Bear LP" width="790" height="170">
  <div class="rule" aria-hidden="true"></div>
  <p class="descriptor">An Investment Holding Company</p>
</main>
<script data-goatcounter="https://muse.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
