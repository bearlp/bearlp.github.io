<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bear LP</title>
<meta name="description" content="An Investment Holding Company">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="Bear LP">
<meta property="og:description" content="An Investment Holding Company">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bearlp.com/">
<meta property="og:image" content="https://bearlp.com/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#0a1c2c;color:#f3eee3;min-height:100vh;min-height:100dvh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:fade 30s linear infinite}
.slide.s1{object-position:94% center;animation-delay:0s}
.slide.s2{object-position:center;animation-delay:6s}
.slide.s3{object-position:center;animation-delay:12s}
.slide.s4{object-position:center;animation-delay:18s}
.slide.s5{object-position:center;animation-delay:24s}
@keyframes fade{0%{opacity:0}2.4%{opacity:1}20%{opacity:1}24.8%{opacity:0}100%{opacity:0}}
body.loading .slide{animation-play-state:paused}
body.loading .slide.s1{opacity:1}
@media (prefers-reduced-motion: reduce){.slide{animation:none}.slide.s1{opacity:1}}
.scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,24,38,.85) 0%,rgba(6,24,38,.35) 32%,rgba(6,24,38,0) 58%),linear-gradient(to bottom,rgba(6,24,38,.35) 0%,rgba(6,24,38,0) 20%)}
.block{position:absolute;left:38px;bottom:44px;z-index:3}
.block img{width:min(320px,62vw);height:auto;display:block}
.rule{width:64px;height:1px;background:#aa936d;margin:25px 0 17px}
.descriptor{font-size:11px;font-weight:500;letter-spacing:.38em;text-transform:uppercase;color:#f3eee3;line-height:1.9}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
@media (max-width:640px){
    .block{left:20px;right:20px;bottom:30px}
  .slide.s1{object-position:96% center}
}
</style>
</head>
<body class="loading">
<img class="slide s1" src="assets/ridge.jpg" alt="" fetchpriority="high" decoding="async">
<img class="slide s2" data-src="assets/forest.jpg" alt="" decoding="async">
<img class="slide s3" data-src="assets/coast.jpg" alt="" decoding="async">
<img class="slide s4" data-src="assets/lake.jpg" alt="" decoding="async">
<img class="slide s5" data-src="assets/pair.jpg" alt="" decoding="async">
<div class="scrim" aria-hidden="true"></div>
<main class="block">
  <h1 class="visually-hidden">Bear LP</h1>
  <img src="assets/vert-silver.svg" alt="Bear LP" width="590" height="285">
  <div class="rule" aria-hidden="true"></div>
  <p class="descriptor">An Investment Holding Company</p>
</main>
<script>
(function () {
  var body = document.body;
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var started = false;
  function startClock() {
    slides.forEach(function (el) {
      el.getAnimations().forEach(function (a) { a.currentTime = 1080; });
    });
    body.classList.remove("loading");
  }
  function loadRest() {
    var queue = slides.slice(1), i = 0;
    (function next() {
      if (i >= queue.length) return;
      var el = queue[i++], url = el.getAttribute("data-src"), pre = new Image();
      pre.onload = pre.onerror = function () { el.src = url; next(); };
      pre.src = url;
    })();
  }
  function begin() {
    if (started) return;
    started = true;
    startClock();
    loadRest();
  }
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    body.classList.remove("loading");
    return;
  }
  var s1 = slides[0];
  if (s1.complete && s1.naturalWidth > 0) begin();
  else {
    s1.addEventListener("load", begin);
    s1.addEventListener("error", begin);
    setTimeout(begin, 4000);
  }
})();
</script>
<script data-goatcounter="https://muse.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
