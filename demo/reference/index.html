<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bear LP - Image Reference</title>
<meta name="description" content="An Investment Holding Company">
<meta name="robots" content="noindex">
<link rel="icon" href="../alt-18-vertical-silver/favicon.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#0c2a42;background:radial-gradient(1100px 700px at 50% 30%,#143a56 0%,#0d2f47 60%,#081f31 100%);color:#f3eee3;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 20px 48px}
header{text-align:center}
header img{width:min(215px,52vw);height:auto;display:block;margin:0 auto}
h1{margin-top:34px;font-size:12px;font-weight:600;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:#c9b184}
header p{margin-top:14px;font-size:13.5px;line-height:1.65;color:rgba(243,238,227,.75)}
main{margin-top:44px;width:min(920px,94vw);display:flex;flex-direction:column;gap:54px}
figure{margin:0}
figure img{width:100%;height:auto;display:block}
figcaption{margin-top:14px;text-align:center}
figcaption .name{font-size:13px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#f3eee3}
figcaption .from{display:block;margin-top:6px;font-size:12.5px;line-height:1.6;color:rgba(243,238,227,.66)}
.divider{text-align:center}
.divider h2{font-size:12px;font-weight:600;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:#c9b184}
.divider p{margin-top:14px;font-size:13.5px;line-height:1.65;color:rgba(243,238,227,.75)}
.back{margin-top:58px;font-size:11px;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase}
.back a{color:#c9b184;text-decoration:none;border-bottom:1px solid rgba(201,177,132,.4);padding-bottom:4px}
footer{margin-top:auto;padding-top:48px;font-size:10px;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:rgba(243,238,227,.5)}
</style>
</head>
<body>
<header>
  <img src="../vert-gold.svg" alt="Bear LP" width="590" height="285">
  <h1>Image Reference</h1>
  <p>Every image from the alternatives, shown in full. All five now rotate in Alt 18, Silver.</p>
</header>
<main>
  <figure>
    <img src="../alt-18-vertical-silver/assets/ridge.jpg" alt="A bear on a ridge above a sea of cloud at dawn">
    <figcaption><span class="name">The Ridge</span><span class="from">Alt 18 The Rotation, and Alt 30 Above the Clouds</span></figcaption>
  </figure>
  <figure>
    <img src="../alt-18-vertical-silver/assets/forest.jpg" alt="A misty forest at dusk">
    <figcaption><span class="name">The Forest</span><span class="from">Alt 18 The Rotation</span></figcaption>
  </figure>
  <figure>
    <img src="../alt-18-vertical-silver/assets/coast.jpg" alt="A rocky coast at blue hour">
    <figcaption><span class="name">The Coast</span><span class="from">Alt 18 The Rotation</span></figcaption>
  </figure>
  <figure>
    <img src="../alt-18-vertical-silver/assets/lake.jpg" alt="A still lake mirroring peaks at dawn, a bear on the far shore">
    <figcaption><span class="name">The Lake</span><span class="from">Alt 24 The Mount</span></figcaption>
  </figure>
  <figure>
    <img src="../alt-18-vertical-silver/assets/pair.jpg" alt="Two bears crossing a ridge above an ocean of mist at dawn">
    <figcaption><span class="name">The Crossing</span><span class="from">Alt 32 The Crossing</span></figcaption>
  </figure>
  <div class="divider">
    <h2>Candidates</h2>
    <p>Seven more, found for the same theming, each distinctly different from the five above. None is in the rotation; they are here for review.</p>
  </div>
  <figure>
    <img src="assets/catch.jpg" alt="A brown bear face on in dark river water, holding a salmon">
    <figcaption><span class="name">Candidate 1 - The Catch</span><span class="from">A close portrait rather than a landscape. Cal Rollins, Unsplash. Original 4511 x 3007.</span></figcaption>
  </figure>
  <figure>
    <img src="assets/falls.jpg" alt="A waterfall plunging into dark water between cliffs, in blue mist">
    <figcaption><span class="name">Candidate 2 - The Falls</span><span class="from">Stirling Falls, Milford Sound. Mark de Jong, Unsplash. Original 5472 x 3648.</span></figcaption>
  </figure>
  <figure>
    <img src="assets/fjord.jpg" alt="A fjord at twilight, steep cliffs and low fog over still water">
    <figcaption><span class="name">Candidate 3 - The Fjord</span><span class="from">Norway. Finn Pietsch, Pexels. Original 5650 x 3767.</span></figcaption>
  </figure>
  <figure>
    <img src="assets/aurora.jpg" alt="Green northern lights over snowy peaks, reflected in dark water">
    <figcaption><span class="name">Candidate 4 - The Aurora</span><span class="from">Francesco Ungaro, Pexels. Original 6240 x 4160.</span></figcaption>
  </figure>
  <figure>
    <img src="assets/lagoon.jpg" alt="Blue icebergs in still water at sunrise, a snowy range behind">
    <figcaption><span class="name">Candidate 5 - The Lagoon</span><span class="from">Bernd Feurich, Pexels. Original 6024 x 4024.</span></figcaption>
  </figure>
  <figure>
    <img src="assets/braided-river.jpg" alt="Braided river channels seen from above, teal water on dark gravel">
    <figcaption><span class="name">Candidate 6 - The Braided River</span><span class="from">Iceland. Björn Austmar Þórsson, Pexels. Original 4161 x 3070.</span></figcaption>
  </figure>
  <figure>
    <img src="assets/lagoon-dusk.jpg" alt="Icebergs in a still lagoon under a heavy dusk sky">
    <figcaption><span class="name">Candidate 7 - The Lagoon at Dusk</span><span class="from">Jökulsárlón, Iceland. Alex Wicks, Unsplash. Original 8966 x 5977.</span></figcaption>
  </figure>
</main>
<p class="back"><a href="../index.html">Back to the demo</a></p>
<footer>bearlp.com</footer>

</body>
</html>
